<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForteCare — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:      #002B5C;
      --navy-mid:  #003D7A;
      --navy-dark: #001A3C;
      --blue:      #1B6FD5;
      --blue-pale: #EEF4FF;
      --red-pale:  #FEF2F2;
      --bg:        #EEF3FB;
      --border:    #DDE6F5;
      --text:      #1C3557;
      --muted:     #6B7FA3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy-mid) 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: 340px; background: #fff; border-radius: 18px;
      padding: 36px 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      text-align: center;
    }
    .logo-wrap {
      width: 64px; height: 64px; margin: 0 auto 14px;
      border-radius: 16px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-wrap img { width: 64px; height: 64px; object-fit: contain; }
    .logo-fallback {
      color: #fff; font-weight: 800; font-size: 28px;
    }
    h1 { font-size: 20px; font-weight: 800; color: var(--text); }
    .sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11.5px; font-weight: 600;
      color: var(--text); margin-bottom: 5px;
    }
    .field input {
      width: 100%; padding: 10px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--bg);
      font-family: inherit; font-size: 13px; color: var(--text); outline: none;
      transition: border-color .15s, background .15s;
    }
    .field input:focus { border-color: var(--blue); background: #fff; }
    .error {
      background: var(--red-pale); color: #991B1B;
      font-size: 12px; font-weight: 600;
      padding: 8px 10px; border-radius: 8px;
      margin: 4px 0 14px; text-align: left;
      display: none;
    }
    .btn {
      width: 100%; padding: 11px; border-radius: 9px;
      background: var(--blue); color: #fff;
      font-size: 13.5px; font-weight: 700;
      border: none; cursor: pointer; font-family: inherit;
      transition: background .15s, transform .1s, box-shadow .15s;
      margin-top: 6px;
    }
    .btn:hover { background: var(--navy-mid); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(27,111,213,.35); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-wrap" id="logo-wrap">
    <img src="assets/images/ForteCare-F-colors.png" alt="ForteCare"
         onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
    <span class="logo-fallback" id="logo-fallback" style="display:none">F</span>
  </div>

  <h1>ForteCare</h1>
  <p class="sub">Gestão Pós Vendas</p>

  <div class="field">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
  </div>
  <div class="field">
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>

  <div class="error" id="error"></div>

  <button class="btn" id="btn-entrar" onclick="tentarLogin()">Entrar</button>

  <p class="hint">Em caso de dúvidas, entre em contato com o administrador do sistema.</p>
  <p class="hint">ForteCare v1.0 · Pós Vendas 2026</p>
</div>



<script>
  const USERS_KEY = 'fortecare_users';

  // Usuário padrão criado na primeira vez que o sistema é aberto
  (function seedDefaultUsers() {
    try {
      const users = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      if (users.length === 0) {
        localStorage.setItem(USERS_KEY, JSON.stringify([{
          id: 1,
          nome: 'Helton Ribeiro',
          email: 'admin@fortecare.com',
          senha: 'fortecare123',
          setor: 'TI',
          tipo: 'Administrador'
        }]));
      }
    } catch {}
  })();

  // Enter no campo de senha aciona o login
  document.getElementById('senha').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tentarLogin();
  });

  function tentarLogin() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const senha = document.getElementById('senha').value;
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('btn-entrar');

    errorEl.style.display = 'none';

    if (!email || !senha) {
      errorEl.innerText = 'Informe e-mail e senha.';
      errorEl.style.display = 'block';
      return;
    }

    let users = [];
    try { users = JSON.parse(localStorage.getItem(USERS_KEY)) || []; } catch {}

    const user = users.find(u => u.email.toLowerCase() === email && u.senha === senha);

    if (!user) {
      errorEl.innerText = 'E-mail ou senha incorretos.';
      errorEl.style.display = 'block';
      document.getElementById('senha').value = '';
      document.getElementById('senha').focus();
      return;
    }

    // Salva sessão e redireciona para o app
    try {
      sessionStorage.setItem('fortecare_session', JSON.stringify({
        id:    user.id,
        nome:  user.nome,
        email: user.email,
        setor: user.setor,
        tipo:  user.tipo
      }));
    } catch {}

    btn.innerText = 'Carregando…';
    btn.disabled = true;
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
