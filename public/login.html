<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForteCare — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/ForteCare-F-colors.png">
  <link rel="stylesheet" href="assets/css/login.css">

  <!-- Configurações para PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0056b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ForteCare">
  <link rel="apple-touch-icon" href="assets/images/ForteCare-F-colors.png">

</head>

<body>

  <div class="card">
    <div class="logo-wrap" id="logo-wrap">
      <img src="assets/images/ForteCare-F-colors.png" alt="ForteCare"
        onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
      <span class="logo-fallback" id="logo-fallback" style="display:none">F</span>
    </div>

    <h1>ForteCare</h1>
    <p class="sub">Gestão Pós Vendas</p>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <label for="senha">Senha</label>
        <a href="#" onclick="solicitarRecuperacao(event)"
          style="font-size: 12px; color: #0056b3; text-decoration: none;">Esqueci minha senha</a>
      </div>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    </div>


    <div class="error" id="error"></div>

    <button class="btn" id="btn-entrar" onclick="tentarLogin()">Entrar</button>

    <p class="hint">Em caso de dúvidas, entre em contato com o administrador do sistema.</p>
    <p class="hint">ForteCare v1.0.0 · Pós Vendas 2026</p>
    <p class="hint hrdev">Desenvolvido por <a href="https://hrdev.com.br/" target="_blank">HR | DEV</a></p>
  </div>

  <script src="assets/JS/login.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA Service Worker registrado com sucesso:', reg.scope))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>

</html>
