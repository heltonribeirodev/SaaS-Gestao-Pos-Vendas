<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForteCare — Nova Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/ForteCare-F-colors.png">
    <link rel="stylesheet" href="assets/css/login.css">


    <!-- Configurações para PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0056b3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ForteCare">
    <link rel="apple-touch-icon" href="assets/images/ForteCare-F-colors.png">
</head>

<body>

    <div class="card">
        <div class="logo-wrap" id="logo-wrap">
            <img src="assets/images/ForteCare-F-colors.png" alt="ForteCare"
                onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
            <span class="logo-fallback" id="logo-fallback" style="display:none">F</span>
        </div>

        <h1 id="page-title">Redefinir Senha</h1>
        <p class="sub" id="page-sub">Digite sua nova senha abaixo</p>

        <div class="field">
            <label for="nova-senha">Nova Senha</label>
            <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        </div>

        <div class="field">
            <label for="confirma-senha">Confirmar Nova Senha</label>
            <input type="password" id="confirma-senha" placeholder="Repita a nova senha" autocomplete="new-password">
        </div>

        <div class="error" id="error" style="display: none;"></div>

        <button class="btn" id="btn-salvar" onclick="redefinirSenha()">Salvar Nova Senha</button>

        <p class="hint" id="back-link" style="margin-top: 15px;">
            <a href="login.html" style="color: #0056b3; text-decoration: none;">← Voltar para o Login</a>
        </p>

        <p class="hint">ForteCare v1.0 · Pós Vendas 2026</p>
    </div>

    <script src="assets/js/nova-senha.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('PWA Service Worker registrado com sucesso:', reg.scope))
                    .catch(err => console.error('Erro ao registrar Service Worker:', err));
            });
        }
    </script>
</body>

</html>
